<!doctype html>
<html lang="en">
  <head>
    <!-- Google Analytics tag -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-5KWLFHZP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- meta description - contact page -->
    <meta
      name="description"
      content="		Contact Local Cafe in Moorabbin by phone, email or through our online enquiry form."
    />

    <title>Local Cafe Moorabbin | Contact Us</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <div class="container hdx-flex">
        <h2>
          <a href="index.html" class="logo">Local Cafe</a>
        </h2>

        <nav>
          <ul class="nx-flex">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html" class="current">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="contact-section container">
        <h1>Contact Us</h1>

        <p class="contact-intro">Have a question? We'd love to hear from you.</p>

        <section class="contact-details">
          <h2>Get in touch</h2>

          <div class="contact-detail">
            <h3>Phone</h3>
            <p>(03) 9111 2222</p>
          </div>

          <div class="contact-detail">
            <h3>Email</h3>
            <a href="mailto:localcafe@contactinfo.com"> localcafe@contactinfo.com </a>
          </div>
        </section>

        <section class="contact-form-panel">
          <h2>Send an enquiry</h2>
          <form class="enquiry-form">
            <div>
              <label for="full-name">Full name (required)</label>
              <input type="text" id="full-name" name="fullName" required />
            </div>

            <div>
              <label for="email">Email (required)</label>
              <input type="email" id="email" name="email" required />
            </div>

            <div>
              <label for="message">Message (required)</label>
              <textarea id="message" name="message" rows="6" required></textarea>
            </div>
          </form>
          <a href="#" class="btn">Send Enquiry</a>
        </section>
      </section>
    </main>
    <footer class="text-center">
      <p>Local Cafe &copy; 2026. All Rights Reserved</p>
    </footer>
  </body>
</html>
